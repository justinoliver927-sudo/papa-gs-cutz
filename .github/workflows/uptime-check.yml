name: Website Uptime Check

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check live website
        env:
          SITE_URL: https://justinoliver927-sudo.github.io/papa-gs-cutz/
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.request

          url = os.environ["SITE_URL"]
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "PaPa-Gs-Cutz-Uptime-Check/1.0"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"HTTP status: {response.status}")
                  if not 200 <= response.status < 400:
                      sys.exit(1)
          except Exception as exc:
              print(f"Website check failed: {exc}")
              sys.exit(1)
          PY
